<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BestCheckout Help Center</title>
  <link rel="icon" href="../assets/brand-mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <style>
    :root{--brand:#0066e6;--brand-50:#eaf2ff;--ink:#242833;--body:#4d5c72;--muted:#718096;--hair:#e6eaf0;--panel:#f7f8fb;--header:#eef5ff;--radius:8px}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scrollbar-gutter:stable}body{margin:0;background:#fff;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.55}
    a{color:inherit}.help-header{height:64px;display:flex;align-items:center;gap:24px;padding:0 max(24px,calc((100% - 1440px)/2 + 28px));background:var(--header);border-bottom:1px solid #dce8f7}.help-brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink);font-size:15px;font-weight:750;line-height:1;text-decoration:none;white-space:nowrap}.help-mark{display:block;width:28px;height:28px;object-fit:contain;filter:drop-shadow(0 3px 7px rgb(90 91 255 / 20%))}.help-search{position:relative;flex:1;max-width:470px;margin:0 auto}.help-search svg{position:absolute;left:12px;top:10px;width:15px;height:15px;fill:none;stroke:var(--muted);stroke-width:2;pointer-events:none}.help-search input{width:100%;height:36px;padding:0 12px 0 36px;border:1px solid #dfe5ed;border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-size:13px;outline:none}.help-header nav{display:flex;align-items:center;gap:20px;margin-left:auto}.help-header nav a{color:#43536b;text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}.help-header nav a:hover{color:var(--brand)}
    .help-layout{display:grid;grid-template-columns:248px minmax(0,820px) 188px;gap:48px;max-width:1440px;margin:0 auto;padding:34px 28px 72px}.help-sidebar{position:sticky;top:20px;align-self:start;padding-right:18px;border-right:1px solid var(--hair);max-height:calc(100vh - 104px);overflow:auto}.sidebar-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px;font-size:12px;font-weight:750;letter-spacing:.06em;color:#64748b;text-transform:uppercase}.sidebar-title span:last-child{display:grid;place-items:center;width:19px;height:19px;border:1px solid #dce3ec;border-radius:50%;font-size:11px;letter-spacing:0}.tree-group{margin:0 0 6px}.tree-toggle{display:flex;align-items:center;width:100%;gap:8px;padding:8px 8px;border:0;border-radius:6px;background:transparent;color:#344258;font:700 13px/1.3 inherit;text-align:left;cursor:pointer}.tree-toggle:hover{background:var(--panel)}.tree-caret{width:12px;height:12px;transition:transform .15s;color:#738196}.tree-toggle[aria-expanded="false"] .tree-caret{transform:rotate(-90deg)}.tree-children{padding:2px 0 5px 20px;border-left:1px solid #e7ebf0;margin-left:13px}.tree-children[hidden]{display:none}.tree-link{display:block;width:100%;padding:6px 9px;border:0;border-radius:6px;background:transparent;color:#607087;font:500 12.5px/1.4 inherit;text-align:left;cursor:pointer}.tree-link:hover{background:#f3f6fb;color:var(--ink)}.tree-link.active{background:var(--brand-50);color:#075fcf;font-weight:700}.tree-empty{padding:14px 9px;color:var(--muted);font-size:12.5px}.tree-empty[hidden]{display:none}.mobile-tree-toggle{display:none}
    .help-main{min-width:0}.breadcrumbs{display:flex;align-items:center;gap:8px;margin:0 0 18px;color:#728096;font-size:12.5px}.breadcrumbs span{color:#a4afbf}.article-kicker{color:var(--brand);font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}.article-head{padding:0 0 32px;border-bottom:1px solid var(--hair)}.article-head h1{margin:8px 0 12px;font-size:34px;line-height:1.16;letter-spacing:-.8px}.article-summary{max-width:710px;margin:0;color:#63728a;font-size:16px;line-height:1.55}.article-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px}.btn{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 13px;border:1px solid #d6dde7;border-radius:7px;background:#fff;color:#344258;font:600 13px inherit;text-decoration:none;cursor:pointer}.btn:hover{border-color:#b8c5d4;background:#f9fafc}.btn-primary{border-color:var(--brand);background:var(--brand);color:#fff}.btn-primary:hover{background:#0058c4}.article-meta{color:#8190a4;font-size:12.5px}.guide-callout{display:flex;gap:11px;margin:28px 0;padding:14px 16px;border:1px solid #d5e5ff;border-radius:9px;background:#f4f8ff;color:#35577f;font-size:13px}.guide-callout i{display:grid;place-items:center;flex:none;width:20px;height:20px;border-radius:50%;background:#dcecff;color:#0865d9;font-size:12px;font-style:normal;font-weight:800}.guide-callout strong{display:block;margin-bottom:2px;color:#244c7d}.guide-section{padding:5px 0 24px}.guide-section h2{margin:26px 0 8px;font-size:20px;letter-spacing:-.2px}.guide-section p{margin:0;color:var(--body);font-size:14px;line-height:1.65}.guide-steps{display:grid;gap:14px;margin:18px 0 4px}.guide-step{display:grid;grid-template-columns:30px 1fr;gap:12px}.guide-step-no{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--brand-50);color:var(--brand);font-size:13px;font-weight:750}.guide-step h3{margin:2px 0 4px;font-size:14px}.guide-step p{font-size:13.5px}.guide-list{margin:13px 0 0;padding-left:20px;color:var(--body);font-size:13.5px}.guide-list li{margin:7px 0}.guide-screenshot{margin:18px 0 4px;border:1px solid #e1e6ed;border-radius:10px;overflow:hidden;background:var(--panel)}.guide-screenshot img{display:block;width:100%;height:auto}.guide-screenshot figcaption{padding:9px 12px;color:#718096;font-size:12px}.related-guides{margin-top:12px;padding:20px;border:1px solid var(--hair);border-radius:10px;background:#fbfcfe}.related-guides h2{margin:0 0 10px;font-size:15px}.related-guides a{display:block;margin-top:7px;color:#075fcf;font-size:13px;font-weight:600;text-decoration:none}.related-guides a:hover{text-decoration:underline}
    .article-toc{position:sticky;top:28px;align-self:start;border-left:1px solid var(--hair);padding-left:18px}.article-toc strong{display:block;margin:0 0 10px;color:#526174;font-size:12px;font-weight:750;letter-spacing:.05em;text-transform:uppercase}.article-toc a{display:block;margin:8px 0;color:#76859a;font-size:12.5px;line-height:1.35;text-decoration:none}.article-toc a:hover{color:var(--brand)}.article-toc a.active{color:#075fcf;font-weight:700}
    .help-footer{max-width:1440px;margin:0 auto;padding:18px 28px 34px;border-top:1px solid var(--hair);color:#8794a6;font-size:12px}.help-footer a{color:#62708d;text-decoration:none}.help-footer a:hover{color:var(--brand)}
    .guide-path{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:15px 0 0;padding:10px 12px;border:1px solid #dbe7f6;border-radius:8px;background:#f8fbff;color:#365270;font-size:12.5px;font-weight:650}.guide-path b{color:#1f3f65}.guide-path span{color:#8ea0b5;font-weight:400}.guide-note{margin:14px 0 0;padding:11px 12px;border-left:3px solid #7aa7e8;border-radius:0 7px 7px 0;background:#f5f8fc;color:#566980;font-size:12.5px;line-height:1.55}.guide-config{display:grid;gap:10px;margin:15px 0 0;padding:14px;border:1px solid #dde5ef;border-radius:9px;background:#fbfcfe}.guide-config div{display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;align-items:start}.guide-config strong{color:#344258;font-size:12.5px}.guide-config span{color:#64758b;font-size:12.5px;line-height:1.5}.guide-config code{padding:2px 5px;border-radius:4px;background:#edf2f8;color:#344d6d;font-size:12px}.guide-resource-list{display:grid;gap:8px;margin:15px 0 0}.guide-resource-list a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid #dce5ef;border-radius:8px;color:#075fcf;font-size:12.5px;font-weight:650;text-decoration:none}.guide-resource-list a::after{content:'Open Shopify docs ↗';color:#74849a;font-size:11px;font-weight:600}.guide-resource-list a:hover{border-color:#9fc1ee;background:#f7fbff}.guide-screenshot--credentials{max-width:680px}.guide-screenshot--credentials img{height:292px;object-fit:cover;object-position:78% 0}.guide-security-list{padding-left:20px}.guide-security-list li::marker{color:#0a67cf}
    @media(max-width:1160px){.help-layout{grid-template-columns:228px minmax(0,1fr);gap:34px}.article-toc{display:none}}@media(max-width:760px){.help-header{height:58px;padding:0 16px;gap:12px}.help-brand span:last-child{font-size:14px}.help-search{order:3;position:absolute;top:68px;left:16px;right:16px;max-width:none}.help-header nav{gap:14px}.help-header nav a:first-child{display:none}.help-layout{display:block;padding:20px 16px 48px}.mobile-tree-toggle{display:flex;align-items:center;justify-content:space-between;width:100%;height:38px;margin:0 0 18px;padding:0 12px;border:1px solid #dce3ec;border-radius:8px;background:#fff;color:#344258;font:600 13px inherit}.help-sidebar{display:none;position:static;max-height:none;margin:0 0 22px;padding:14px;border:1px solid var(--hair);border-radius:10px;background:#fff}.help-sidebar.is-open{display:block}.article-head{padding-bottom:24px}.article-head h1{font-size:27px}.article-summary{font-size:14.5px}.guide-section h2{font-size:18px}.help-footer{padding:16px}.guide-screenshot{margin-left:0;margin-right:0}}
    /* Reading scale: keep navigation scannable while making long-form guides comfortable at desktop widths. */
    body{font-size:15px;line-height:1.6}
    .sidebar-title{font-size:12.5px}
    .tree-toggle{padding:9px 8px;font-size:14px;line-height:1.4}
    .tree-link{padding:7px 10px;font-size:13.5px;line-height:1.5}
    .tree-empty{font-size:13.5px}
    /* Keep the guide tree in the same typeface as the article body. The
       original font shorthand could fall back differently in some browsers. */
    .help-sidebar,.help-sidebar button,.help-sidebar a,.mobile-tree-toggle{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    .tree-toggle{font-family:inherit;font-weight:600}
    .tree-link{font-family:inherit;font-weight:400}
    .tree-link.active{font-weight:600}
    .mobile-tree-toggle{font-weight:600}
    .help-brand{font-size:24px;font-weight:700;letter-spacing:-.035em}
    .help-mark{width:32px;height:32px;font-size:16px}
    /* Header: the search is the primary action and stays centered in the full page header. */
    .help-header{position:relative;justify-content:flex-start;gap:0}
    @media(min-width:761px){.help-header{padding-inline:max(24px,calc((100% - 1440px)/2 + 20px))}}
    .help-search{position:absolute;left:50%;width:min(470px,calc(100% - 360px));max-width:none;margin:0;transform:translateX(-50%)}}
    @media(max-width:760px){.help-search{width:auto;transform:none}}
    .breadcrumbs{font-size:13px}
    .breadcrumbs .breadcrumb-label{color:#728096}
    .breadcrumbs .breadcrumb-separator{color:#a4afbf}
    .article-kicker{font-size:12.5px}
    .article-summary{font-size:17px;line-height:1.6}
    .article-meta{font-size:13px}
    .guide-callout{font-size:14px;line-height:1.6}
    .guide-callout i{font-size:12.5px}
    .guide-section h2{font-size:22px;line-height:1.3}
    .guide-section p{font-size:15px;line-height:1.7}
    .guide-step h3{font-size:15px;line-height:1.4}
    .guide-step p{font-size:14.5px;line-height:1.65}
    .guide-list{font-size:14.5px;line-height:1.65}
    .guide-screenshot figcaption{font-size:12.5px;line-height:1.5}
    .related-guides h2{font-size:16px}
    .related-guides a{font-size:14px}
    .article-toc strong{font-size:12.5px}
    .article-toc a{font-size:13.5px;line-height:1.45}
    .help-footer{font-size:12.5px}
    .guide-path{font-size:13.5px;line-height:1.5}
    .guide-note{font-size:13.5px;line-height:1.6}
    .guide-config strong,.guide-config span{font-size:13.5px;line-height:1.55}
    .guide-config code{font-size:12.5px}
    .guide-resource-list a{font-size:13.5px}
    .guide-resource-list a::after{font-size:11.5px}
    @media(max-width:760px){
      body{font-size:14px}
      .tree-toggle{font-size:13.5px}
      .tree-link{font-size:13px}
      .article-summary{font-size:15.5px}
      .guide-section h2{font-size:20px}
      .guide-section p{font-size:14.5px;line-height:1.65}
      .guide-step p,.guide-list{font-size:14px}
      .feature-table tbody th,.feature-table td{font-size:14px;line-height:1.55}
    }
    .feature-table-wrap{margin:14px 0 4px;border:1px solid var(--hair);border-radius:9px;overflow:hidden;container-type:inline-size}
    .feature-table{width:100%;border-collapse:collapse;background:#fff}
    .feature-table th,.feature-table td{padding:11px 14px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}
    .feature-table thead th{background:#f7f8fb;color:#526174;font-size:12px;font-weight:750;letter-spacing:.04em;text-transform:uppercase}
    .feature-table tbody th{width:34%;color:var(--ink);font-size:14.5px;font-weight:650;line-height:1.45}
    .feature-table td{color:var(--body);font-size:14.5px;font-weight:400;line-height:1.6}
    .feature-table tr:last-child th,.feature-table tr:last-child td{border-bottom:0}
    .feature-table tr.feature-group th{background:#f3f6fb;padding:12px 14px 10px;color:var(--ink);font-size:13px;font-weight:750;letter-spacing:.04em;text-transform:uppercase}
    .feature-table tr.feature-group th span{display:block;margin-top:4px;color:#526174;font-size:13px;font-weight:450;letter-spacing:0;text-transform:none;line-height:1.5}
    .feature-table tr.feature-sub th{background:#fff;padding:10px 14px 2px;border-bottom:0;color:#526174;font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase}
    .feature-table tr.feature-page td{background:#f3f4f6;text-align:center}
    .feature-table tr.feature-page p{margin:0 auto 4px;max-width:420px;color:#526174;font-size:13px;text-align:left}
    .feature-table tr.feature-page .cko.cko-page:not(.is-live){display:block;margin:8px auto 4px}
    .feature-table tr.feature-page .cko-live-fit{margin:8px 0 4px;text-align:left}
    .feature-table tr.feature-lookbook td{padding:14px 16px;background:#f8fbff;text-align:left}
    .feature-table tr.feature-lookbook a{color:#075fcf;font-size:14px;font-weight:650;text-decoration:none}
    .feature-table tr.feature-lookbook a:hover{text-decoration:underline}
    @container(max-width:760px){
      .feature-table,.feature-table tbody,.feature-table tr,.feature-table th,.feature-table td{display:block;width:100%}
      .feature-table thead{display:none}
      .feature-table tr{border-bottom:1px solid var(--hair)}
      .feature-table tr:last-child,.feature-table tr:last-child th,.feature-table tr:last-child td{border-bottom:0}
      .feature-table tbody th,.feature-table td{width:100%;border-bottom:0}
      .feature-table tbody th{padding-bottom:2px}
      .feature-table td{padding-top:2px}
      .feature-table .cko,.feature-table .feature-shot,.feature-table .feature-shots,.feature-table .cko-live-fit,.feature-table img{max-width:100%}
      .feature-table .cko{width:100%}
    }
    .feature-shot{display:block;width:min(100%,440px);height:auto;margin-top:10px;border:1px solid #e6eaf0;border-radius:8px;background:#fff}
    .cko{width:min(100%,440px);margin-top:10px;border:1px solid #e6eaf0;border-radius:8px;background:#fff;padding:14px 16px 16px;box-sizing:border-box;color:#1f1f1f;font-size:14px;line-height:1.45}
    .cko.is-bleed{padding:0;overflow:hidden}
    .cko-h{margin:0 0 10px;font-size:16px;font-weight:650;line-height:1.3}
    .cko-card{border:1px solid #e5e5e5;border-radius:8px;padding:12px}
    .cko-check{flex:none;width:18px;height:18px;border:1.5px solid #d9d9d9;border-radius:5px;background:#fff;box-sizing:border-box}
    .cko-row{display:flex;align-items:center;gap:10px}
    .cko-muted{color:#777;font-size:12px}
    .cko-price{font-weight:700}
    .cko-was{color:#777;font-size:12px;text-decoration:line-through;margin-left:6px}
    .cko-thumb{flex:none;width:64px;height:64px;border-radius:8px;overflow:hidden;background:#f3f1ee}
    .cko-thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .cko-select{display:inline-flex;align-items:center;box-sizing:border-box;height:32px;max-width:100%;border:1px solid #d9d9d9;border-radius:6px;padding:0 28px 0 10px;color:#1f1f1f;font-size:12px;line-height:1;background:#fff;position:relative}
    .cko-select::after{content:"";position:absolute;right:10px;top:50%;width:7px;height:7px;border-right:1.5px solid #8a8a8a;border-bottom:1.5px solid #8a8a8a;transform:translateY(-70%) rotate(45deg)}
    .cko-step{display:inline-flex;align-items:center;border:1px solid #d9d9d9;border-radius:8px;overflow:hidden}
    .cko-step b,.cko-step span{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-weight:600}
    .cko-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
    .cko-shield{flex:none;width:26px;height:26px;color:#1f1f1f}
    .cko-title{font-weight:700}
    .cko-vip .cko-check{width:22px;height:22px;border-radius:6px}
    .cko-boxes{display:inline-flex;gap:3px;line-height:0}
    .cko-boxes i{width:18px;height:18px;border-radius:2px;background:#00b67a;display:inline-flex;align-items:center;justify-content:center}
    .cko-boxes svg,.cko-brandstar{display:block}
    .cko-tp-top{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-weight:800}
    .cko-tp-brand{display:inline-flex;align-items:center;gap:5px;margin-left:4px;font-weight:700}
    .cko-tp-card{border:1px solid #e5e5e5;border-radius:8px;padding:14px;margin-top:10px;background:#fff}
    .cko-tp-card strong{display:block;margin:8px 0 4px}
    .cko-verified{color:#00b67a;font-weight:650}
    .cko-review{display:flex;gap:16px;align-items:center;border:1px solid #e5e5e5;border-radius:8px;padding:16px}
    .cko-photo{flex:none;width:84px;height:84px;border-radius:10px;object-fit:cover;display:block}
    .cko-round{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;display:block}
    .cko-quotes{display:grid;gap:10px}
    .cko-quote{border:1px solid rgba(0,0,0,.06);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .cko-gold{color:#f5b301;letter-spacing:1px}
    .cko-who{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:650;font-size:12px}
    .cko-comment{display:flex;gap:8px;align-items:flex-start;margin-top:14px}
    .cko-comment:first-child{margin-top:0}
    .cko-bubble{background:#f0f2f5;border-radius:18px;padding:8px 12px;display:inline-block;max-width:100%}
    .cko-meta{display:flex;align-items:center;gap:14px;margin:5px 0 0 12px;font-size:12px;color:#777;font-weight:700}
    .cko-like{color:#1877f2}
    .cko-react{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-weight:600}
    .cko-emos{display:inline-flex;align-items:center}
    .cko-emo{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #fff,0 1px 2px rgba(0,0,0,.18);font-size:10px;line-height:1}
    .cko-emo+.cko-emo{margin-left:-6px}
    .cko-replies{display:flex;align-items:center;gap:8px;margin:9px 0 0 6px;font-size:12px;color:#777;font-weight:450}
    .cko-brandph{flex:none;width:24px;height:24px;border-radius:50%;background:#243b2f;color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
    .cko-badge{display:flex;gap:14px;align-items:center;margin-top:14px}
    .cko-ico{flex:none;width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;color:#121212}
    .cko-ico svg{display:block}
    .cko-paylogos{display:block;width:100%;height:auto}
    .cko-plogos{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px}
    .cko-plogos img{height:22px;width:auto;display:block}
    .cko-plogos img.is-card{height:26px}
    .cko-plogos img.is-paypal{height:16px}
    .cko.cko-mcp{width:min(100%,560px);padding:12px 12px 14px}
    .cko-mcp-title{margin-bottom:2px;color:#182238;font-size:15px;font-weight:750}
    .cko-mcp-card{margin-top:8px;padding:10px 12px;border:1px solid #e6eaf0;border-radius:10px}
    .cko-mcp-card strong{display:block;color:#182238;font-size:13px;font-weight:650}
    .cko-mcp-card p,.cko-mcp-card small{display:block;margin:4px 0 0;color:#526174;font-size:12px;font-weight:450;line-height:1.45}

          ['Add the DNS record','Copy the CNAME record to the provider that manages your domain. BestCheckout detects the record and handles SSL.',['DNS updates can take a few minutes.','Do not send live traffic until the domain shows as connected.'],{kind:'domain-dns',caption:'The CNAME record to add at your domain provider.'}]

        'first-flow': {group:'Getting started',title:'Publish your first purchase flow',action:'Open purchase flows',href:'../#/flows',summary:'Create a focused purchase flow, select the checkout pages customers see and publish only after the connection, payment and domain checks are ready.',sections:[['Start with one clear path','Choose a flow goal, name the draft and select the entry conditions.',['Use the default checkout path for an initial launch.','Add an Upsell or Downsell only when it supports the flow goal.']],['Review before publishing','Preview the path, confirm the selected checkout page and review the entry conditions.',['Publishing sends eligible traffic to BestCheckout.','Customers who are not eligible continue to Shopify Checkout.']]],related:['create-flow','connect-shopify','payment-services']},
        'create-flow': {group:'Purchase flows',title:'Create a purchase flow',action:'Open purchase flows',href:'../#/flows',summary:'A purchase flow defines the customer journey from a BestCheckout checkout page through any eligible post-purchase pages.',sections:[['Choose the goal and path','Start from the path that matches the campaign: checkout only, checkout with Upsell, or checkout with Upsell and Downsell.',['The selected path keeps the page sequence simple and predictable.','Checkout and Thank you remain part of every complete journey.'],{kind:'flow-paths'}],['Name the draft','Use a name your team can recognize in orders and performance reporting.',['A draft never changes live customer traffic.','Configure entry conditions after the flow is created.']]],related:['customer-entry','checkout-pages','publish-preview']},
        'customer-entry': {group:'Purchase flows',title:'Customer entry and eligibility',action:'Configure a flow',href:'../#/flows',summary:'Choose which buyers enter a purchase flow. Every condition you add has to match. Buyers who do not match stay on Shopify Checkout.',sections:[
          ['How a buyer gets in','These conditions decide which buyers enter this purchase flow. Every condition on the flow has to match. Conditions you do not add are not checked. Add the limits you need for who enters BestCheckout.',['Leave this empty and every buyer can enter the flow.','Customers who do not match continue to Shopify Checkout.','If several live flows match the same cart, the higher priority is used.'],{kind:'entry',caption:'The window where you add entry conditions. Every row has to match.'}],
          ['Customer','Account status applies to every buyer. The other conditions in this group apply only to recognized Shopify customers. If the flow requires one of those and the buyer is not recognized, they stay on Shopify Checkout.',['Account status: signed in or guest. This applies to every buyer.','First order or returning: new customer or returning customer.','Customer tags: has any of the tags, has all of them, or has none of them.','Email marketing consent: subscribed or not subscribed.','Past orders and customer lifetime spend: at least, at most, equal to, not equal to, or between two numbers.','Last order date: within the last number of days, or more than that many days ago.']],
          ['Storefront','The country and language of the Shopify storefront the buyer is browsing.',['Storefront country: the country the shopper is browsing in. Match with is or is not.','Storefront language: the language the shopper is browsing in. Match with is or is not.']],
          ['Cart','The cart when the buyer leaves the storefront.',['Cart subtotal, cart total, and cart item count use the same number rules: at least, at most, equal to, not equal to, or between two numbers.','Cart currency: the currency of the cart. Match with is or is not.','Cart contains products: any selected products or SKUs, all of them, or none of them.']],
          ['Ways to use the conditions','One condition is enough for many flows. Add another only when the buyer must match both.',['A high-value checkout: cart subtotal is at least the amount you choose.','A local offer: storefront country is, or is not, the country you choose.','A first-order offer: account status is signed in, and first order or returning is new customer.']]
        ],related:['traffic-allocation','publish-preview']},
        'traffic-allocation': {group:'Purchase flows',title:'Traffic allocation',action:'Open purchase flows',href:'../#/flows',summary:'Allocate traffic only when a purchase flow contains more than one BestCheckout checkout page. It does not route traffic to Shopify Checkout.',sections:[
          ['Add another checkout page','Create a second BestCheckout checkout page inside the flow when you need to compare page variants.',['The checkout pages must add up to 100% of eligible flow traffic.','Shopify Checkout remains the fallback for customers outside the flow.'],{kind:'flow-canvas',caption:'One purchase flow with two Checkout pages. Their traffic adds up to 100%.'}],
          ['Review allocation before publishing','Use a clear percentage for each BestCheckout checkout page and review the preview path.',['Start with an even split for a simple comparison.','Change traffic only after you have enough purchase data.']]

        'publish-preview': {group:'Purchase flows',title:'Publish, pause and preview',action:'Open purchase flows',href:'../#/flows',summary:'Preview a purchase flow before customers see it, then publish or pause it from the flow detail page.',sections:[['Preview the complete path','Preview Checkout, Upsell, Downsell and Thank you in the order customers will see them.',['A preview is safe and does not send live traffic.','Confirm the selected templates and product offers.']],['Manage live status','Publish when the path and entry rules are ready. Pause when you need to stop new BestCheckout traffic.',['Pausing never removes the flow configuration.','Shopify Checkout stays available as the fallback.']]],related:['first-flow']},

        'thank-you': {group:'Checkout pages',title:'Thank you page',action:'Open checkout pages',href:'../#/pages',summary:'Shown when the path is complete. This page confirms the order and does not sell another product.',catalog:true,sections:[['Components and preview','Shown when the path is complete. This page does not sell another product.',[

        'orders': {group:'Orders and Shopify sync',title:'BestCheckout orders',action:'Open orders',href:'../#/orders',summary:'The Orders list shows paid orders captured through BestCheckout. Unpaid Hosted Checkout orders appear under Abandoned checkouts. Native Shopify abandoned checkouts remain in Shopify.',sections:[['Understand what appears here','A BestCheckout order appears after payment succeeds. It is then sent to Shopify so your usual fulfillment process can continue.',['Use the order detail page for the payment and sync context.','Use Abandoned checkouts for unpaid Hosted Checkout sessions.','Use the Shopify order for fulfillment and refunds.']],['Filter the order list','Filter paid BestCheckout orders by key fields, date and total range to find the record you need.',['Open the order detail from the row or the eye action.','Check Shopify sync status before taking action.']]],related:['abandoned-checkouts','sync-status','fulfillment']},
        'abandoned-checkouts': {group:'Orders and Shopify sync',title:'Abandoned checkouts',action:'Open abandoned checkouts',href:'../#/abandoned-checkouts',summary:'Abandoned checkouts are unpaid Hosted Checkout orders that already have an email or phone number. They are not written to Shopify until the buyer pays.',sections:[['What appears here','A checkout becomes abandoned only after the buyer leaves an email or phone number, then stays unpaid for the idle delay.',['Checkouts with no contact never appear here.','Phone-only checkouts can be recovered with a link, but cannot receive a reminder.','Shopify native abandoned checkouts stay in Shopify Admin.']],['Recover a checkout','Copy the recovery link or send one reminder to a subscribed buyer with an email.',['The link reopens the same unpaid Hosted Checkout.','Payment success moves the record to Orders and starts Shopify write-back.']]],related:['orders','fulfillment']},
        'sync-status': {group:'Orders and Shopify sync',title:'Shopify sync status',action:'Open orders',href:'../#/orders',summary:'Shopify sync status explains whether a paid BestCheckout order is ready for your Shopify fulfillment workflow.',sections:[['In Shopify','The order was created successfully in Shopify and can follow your normal fulfillment process.',['Use View in Shopify when you need the Shopify record.']],['Needs attention','BestCheckout could not create the Shopify order yet. Review the order and Shopify connection before retrying.',['Do not treat this as a payment failure.']]],related:['orders','connection-sync']},
        'fulfillment': {group:'Orders and Shopify sync',title:'Fulfillment in Shopify',action:'Open orders',href:'../#/orders',summary:'BestCheckout captures payment and writes the paid order back to Shopify. Shopify remains the fulfillment workspace for your team.',sections:[['Wait for the Shopify order','Complete fulfillment only after the order sync shows In Shopify or Created in Shopify.',['Inventory and fulfillment apps continue to use Shopify as the source of truth.']],['Handle post-purchase work in Shopify','Ship, refund and communicate with the customer from Shopify after the order is created.',['BestCheckout keeps the checkout and sync context visible in its order detail.']]],related:['orders','sync-status']},
        'connection-sync': {group:'Settings and team',title:'Shopify connection and data sync',action:'Open Shopify connection',href:'../#/settings/base',summary:'Review the connected store and the catalog, discount, shipping and customer data that BestCheckout uses for checkout.',sections:[['Check connection health','The Shopify connection page shows the store, domain and data sync status.',['Sync products and variants before configuring offers.','Sync discounts and shipping options before publishing checkout traffic.']],['Review before changing access','Use Manage connection only when you need to refresh access, replace the custom app or intentionally disconnect the store.',['Disconnecting stops routing, sync and order write-back.']]],related:['connect-shopify','sync-status']},
        'email-notifications': {group:'Settings and team',title:'Email notifications',action:'Open email notifications',href:'../#/settings/notifications',summary:'BestCheckout sends the abandoned checkout email and the refund email. The order confirmation email follows Shopify.',sections:[
          ['Abandoned checkout email','Sent once after a Hosted Checkout becomes abandoned. The buyer needs an email address. A phone-only checkout can be recovered with a link, but does not receive this email.',['The checkout is marked abandoned about 10 minutes after an email is left.','The email links back to the same unpaid checkout.'],{kind:'email',variant:'abandoned',caption:'The abandoned checkout email. It lists the items and links back to checkout.'}],
          ['Refund email','Sent when a refund is issued in BestCheckout, up to the amount captured on that order.',['The email states the refunded amount.','It can take up to 10 days to appear on the buyer’s account.'],{kind:'email',variant:'refund',caption:'The refund email. It shows the order and the amount refunded.'}],
          ['Order confirmation stays in Shopify','BestCheckout does not send an order confirmation email. After the paid order is created in Shopify, Shopify sends that email.',['Edit the order confirmation in Shopify.','The Thank you page in BestCheckout is the on-site confirmation, not this email.']]
        ],related:['abandoned-checkouts','orders','thank-you']},
        'roles': {group:'Settings and team',title:'Roles and permissions',action:'Open roles',href:'../#/settings/roles',summary:'Create roles that give each teammate only the permissions they need in BestCheckout.',sections:[['Create roles around responsibilities','Use clear role names such as Order Specialist or Campaign Manager.',['Assign only the modules each role needs.','Review role membership before deleting a role.']],['Maintain access over time','Update permissions as responsibilities change.',['A role that is in use cannot be deleted until team assignments are changed.']]],related:['staff']},
        'staff': {group:'Settings and team',title:'Staff management',action:'Open staff',href:'../#/settings/staff',summary:'Add team members in BestCheckout and manage whether each account is active.',sections:[['Add staff in the admin','Create a staff account with email, name and role. The account is available immediately and does not use an invite or access code.',['Use Inactive when a teammate should keep the record but no longer sign in.']],['Keep access current','Edit the role or status when responsibilities change, and delete accounts that are no longer needed.',['A staff account is either Active or Inactive.']]],related:['roles']},

      function translateStatic(root) {
        if (!PACK || !root) return;
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        var nodes = [];
        var node;
        while ((node = walker.nextNode())) nodes.push(node);
        nodes.forEach(function (textNode) {
          var raw = textNode.nodeValue;
          var trimmed = raw.trim();
          if (!trimmed || !Object.prototype.hasOwnProperty.call(PACK, trimmed)) return;
          textNode.nodeValue = raw.replace(trimmed, PACK[trimmed]);
        });
        ['aria-label', 'title'].forEach(function (attr) {
          var elements = root.matches && root.matches('[' + attr + ']') ? [root] : [];
          elements = elements.concat(Array.prototype.slice.call(root.querySelectorAll('[' + attr + ']')));
          elements.forEach(function (element) {
            var value = element.getAttribute(attr);
            if (value && Object.prototype.hasOwnProperty.call(PACK, value)) element.setAttribute(attr, PACK[value]);
          });
        });
      }
      translateStatic(document.querySelector('.help-brand'));
      translateStatic(mobileToggle);
      translateStatic(sidebar);
      translateStatic(document.querySelector('.article-toc > strong'));
      translateStatic(document.querySelector('.help-footer'));
